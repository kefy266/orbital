name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One run per ref: a newer push cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.10.*"

jobs:
  linux:
    name: Linux (Qt 6)
    runs-on: ubuntu-latest
    # Orbital needs a recent Qt 6 (Quick Effects, KSyntaxHighlighting); Arch ships it.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git python \
            qt6-base qt6-declarative qt6-svg syntax-highlighting ttf-dejavu curl squashfs-tools

      - uses: actions/checkout@v4

      - name: Check store catalog and site
        run: |
          python -c "import json; items = json.load(open('store/index.json'))['items']; print(len(items), 'store items')"
          python scripts/build_site.py
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code docs/index.html || (echo "docs/index.html is stale: run scripts/build_site.py" && exit 1)

      - name: Build Orbital
        run: |
          qmake6 orbital.pro -o build.mk
          make -f build.mk -j"$(nproc)"

      - name: Build engine test
        run: |
          cd tests
          qmake6 enginetest.pro -o enginetest.mk
          make -f enginetest.mk -j"$(nproc)"

      - name: Smoke test (UI loads offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          ORBITAL_SCREENSHOT: ${{ github.workspace }}/smoke-linux.png
          ORBITAL_SCREENSHOT_DELAY: "4000"
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          timeout 60 ./build/orbital
          test -s smoke-linux.png

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-linux
          path: smoke-linux.png

  # The AppImage is built on an older Ubuntu (glibc 2.35) with Qt bundled inside,
  # so it runs on most distributions without installing Qt.
  appimage:
    name: Linux AppImage (Qt bundled)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 libfuse2 file

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwaylandcompositor
          cache: true

      - name: Build Orbital
        run: |
          qmake CONFIG+=release orbital.pro -o build.mk
          make -f build.mk -j"$(nproc)"

      - name: Bundle Qt into an AppImage
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/resources/qml
          EXTRA_PLATFORM_PLUGINS: libqwayland.so;libqoffscreen.so
          EXTRA_QT_MODULES: waylandcompositor;svg
          NO_STRIP: "1"
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/orbital AppDir/usr/bin/orbital
          cp resources/orbital.svg AppDir/usr/share/icons/hicolor/scalable/apps/orbital.svg
          cat > AppDir/usr/share/applications/orbital.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Orbital
          Exec=orbital
          Icon=orbital
          Categories=Development;
          Comment=AI coding assistant
          Terminal=false
          StartupWMClass=orbital
          EOF
          sed -i 's/^ *//' AppDir/usr/share/applications/orbital.desktop

          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$(command -v qmake)"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/orbital.desktop \
            --icon-file resources/orbital.svg

          # Portal file dialogs and Wayland work out of the box; fall back to X11 if Wayland fails.
          mkdir -p AppDir/apprun-hooks
          cat > AppDir/apprun-hooks/orbital-env.sh << 'EOF'
          [ -z "$QT_QPA_PLATFORMTHEME" ] && export QT_QPA_PLATFORMTHEME=xdgdesktopportal
          [ -z "$QT_QPA_PLATFORM" ] && [ -n "$WAYLAND_DISPLAY" ] && export QT_QPA_PLATFORM="wayland;xcb"
          EOF
          sed -i 's/^ *//' AppDir/apprun-hooks/orbital-env.sh

          ./linuxdeploy --appimage-extract-and-run --appdir AppDir --output appimage
          [ -f Orbital-x86_64.AppImage ] || mv Orbital*-x86_64.AppImage Orbital-x86_64.AppImage
          tar -C AppDir -czf orbital-linux-x86_64.tar.gz .

      - name: Smoke test (bundled AppImage, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          ORBITAL_SCREENSHOT: ${{ github.workspace }}/smoke-appimage.png
          ORBITAL_SCREENSHOT_DELAY: "4000"
          QT_FORCE_STDERR_LOGGING: "1"
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          # Make sure no Qt from the build machine leaks in: only the bundled copy may be used.
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QT_ROOT_DIR \
            timeout 60 ./Orbital-x86_64.AppImage --appimage-extract-and-run
          test -s smoke-appimage.png
          ls -la Orbital-x86_64.AppImage orbital-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux
          path: |
            Orbital-x86_64.AppImage
            orbital-linux-x86_64.tar.gz
            smoke-appimage.png

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Build Orbital
        shell: cmd
        run: |
          qmake CONFIG+=release orbital.pro -o build.mk
          nmake /nologo /f build.mk

      - name: Smoke test (UI loads offscreen)
        shell: pwsh
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          ORBITAL_SCREENSHOT: ${{ github.workspace }}\smoke-windows.png
          ORBITAL_SCREENSHOT_DELAY: "4000"
        run: |
          $p = Start-Process -FilePath build\Orbital.exe -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "Orbital exited with $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path smoke-windows.png)) { Write-Error "no screenshot"; exit 1 }

      - name: Package (bundle Qt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Orbital | Out-Null
          Copy-Item build\Orbital.exe, README.md dist\Orbital\
          windeployqt --release --compiler-runtime --no-translations --qmldir resources\qml dist\Orbital\Orbital.exe
          Compress-Archive -Path dist\Orbital -DestinationPath Orbital-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Orbital-windows-x64.zip
            smoke-windows.png

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Build Orbital
        run: |
          qmake CONFIG+=release orbital.pro -o build.mk
          make -f build.mk -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test (UI loads offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          ORBITAL_SCREENSHOT: ${{ github.workspace }}/smoke-macos.png
          ORBITAL_SCREENSHOT_DELAY: "4000"
        run: |
          perl -e 'alarm 60; exec @ARGV' build/Orbital.app/Contents/MacOS/Orbital
          test -s smoke-macos.png

      - name: Package (bundle Qt)
        run: |
          macdeployqt build/Orbital.app -qmldir=resources/qml
          rm -rf build/Orbital.app/Contents/PlugIns/sqldrivers
          codesign --force --deep --sign - build/Orbital.app
          test -f build/Orbital.app/Contents/Resources/orbital.icns
          # Disk image with the usual "drag Orbital onto Applications" layout.
          mkdir -p dmg
          cp -R build/Orbital.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Orbital -srcfolder dmg -ov -format UDZO Orbital-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Orbital-macos-arm64.dmg
            smoke-macos.png

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, appimage, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux/Orbital-x86_64.AppImage
            artifacts/linux/orbital-linux-x86_64.tar.gz
            artifacts/windows/Orbital-windows-x64.zip
            artifacts/macos/Orbital-macos-arm64.dmg
